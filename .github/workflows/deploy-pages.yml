name: Deploy Pages

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve preview path
        id: preview
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_SLUG="${BRANCH_NAME//\//-}"

          if [ "$BRANCH_NAME" = "main" ]; then
            echo "base_path=/zhidao-game/" >> "$GITHUB_OUTPUT"
            echo "preview_url=https://winndyPing.github.io/zhidao-game/" >> "$GITHUB_OUTPUT"
            echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/zhidao-game/previews/$BRANCH_SLUG/" >> "$GITHUB_OUTPUT"
            echo "preview_url=https://winndyPing.github.io/zhidao-game/previews/$BRANCH_SLUG/" >> "$GITHUB_OUTPUT"
            echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.preview.outputs.base_path }}

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy main site
        if: steps.preview.outputs.is_main == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true

      - name: Deploy branch preview
        if: steps.preview.outputs.is_main != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: previews/${{ steps.preview.outputs.branch_slug }}
          keep_files: true

      - name: Write summary
        run: |
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.preview.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
